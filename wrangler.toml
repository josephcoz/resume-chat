name = "resume-chat"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Static assets — the chat UI lives here, served by env.ASSETS.fetch().
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Workers AI binding — gives the Worker access to env.AI.run().
# No API key needed; auth is via the binding.
[ai]
binding = "AI"
